<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #content {
      height: 620px;
      overflow: auto;
      padding: 16px 18px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #1B2430;
    }
    mark { padding: 0 3px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script>
    function send(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data), "*");
    }
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 620});

    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "streamlit:render") return;
      var html = (event.data.args && event.data.args.html) || "";
      document.getElementById("content").innerHTML = html;
    });

    function grabSelection() {
      var t = (window.getSelection() || "").toString().trim();
      if (t.length >= 2) {
        send("streamlit:setComponentValue", {value: t, dataType: "json"});
      }
    }
    document.addEventListener("mouseup", grabSelection);
    document.addEventListener("keyup", grabSelection);
  </script>
</body>
</html>
